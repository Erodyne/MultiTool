name: Collaudo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collaudo:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Installa come in un PC (Program Files + ProgramData)
        shell: pwsh
        run: |
          $dst = "$env:ProgramFiles\MultiTool"
          New-Item -ItemType Directory $dst -Force | Out-Null
          Copy-Item MultiTool.ps1, MultiTool.ico, MultiTool-512.png, Avvia.vbs $dst -Force
          Copy-Item Strumenti $dst -Recurse -Force
          New-Item -ItemType Directory "$env:ProgramData\MultiTool\Profili" -Force | Out-Null
          Copy-Item Profili\* "$env:ProgramData\MultiTool\Profili" -Force
          # simula la cartella dati rovinata dalla versione precedente (file senza permessi)
          New-Item -ItemType Directory "$env:ProgramData\MultiTool\Dati" -Force | Out-Null
          '{"TermsAccepted":"1","Lang":"it"}' | Set-Content "$env:ProgramData\MultiTool\Dati\settings.json"
          icacls "$env:ProgramData\MultiTool" /inheritance:r /grant:r "*S-1-5-32-544:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-545:(OI)(CI)RX" /T /C /Q
          # winget sul server di collaudo, con un 7-Zip vecchio da aggiornare
          $wg = Get-ChildItem "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($wg) {
            & $wg.FullName --version
            & $wg.FullName uninstall --id 7zip.7zip --exact --silent --accept-source-agreements --disable-interactivity | Select-Object -Last 2
            & $wg.FullName uninstall --id VideoLAN.VLC --exact --silent --accept-source-agreements --disable-interactivity | Select-Object -Last 2
            & $wg.FullName install --id 7zip.7zip --version 23.01 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity | Select-Object -Last 2
            & $wg.FullName list --id 7zip.7zip --accept-source-agreements --disable-interactivity | Select-Object -Last 3
            "MT_WINGET=1" | Out-File $env:GITHUB_ENV -Append
          }
          exit 0

      - name: Diagnostica winget dentro MultiTool
        shell: powershell
        run: |
          $src = Get-Content MultiTool.ps1 -Raw
          $h = [regex]::Match($src, "(?s)\`$Helpers = @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          $DataDir = "$env:TEMP\mtdiag"; New-Item -ItemType Directory $DataDir -Force | Out-Null; $sync = @{}; $Root = (Get-Location).Path
          . ([scriptblock]::Create($h))
          "winget: $(Get-WingetPath)"
          $r = Invoke-Hidden (Get-WingetPath) 'upgrade --include-unknown --accept-source-agreements --disable-interactivity' 300
          "codice $($r.Code), lunghezza $($r.Out.Length)"; "---OUT---"; $r.Out; "---ERR---"; $r.Err
          "righe tabella: $(@(ConvertFrom-WingetTable $r.Out -FirstOnly).Count)"
          $r2 = Invoke-Hidden (Get-WingetPath) 'search "vlc" --accept-source-agreements --disable-interactivity' 120
          "search codice $($r2.Code), lunghezza $($r2.Out.Length)"; $r2.Out | Select-Object -First 1 | ForEach-Object { $_.Substring(0, [Math]::Min(1500, $_.Length)) }
          "righe ricerca: $(@(ConvertFrom-WingetTable $r2.Out).Count)"
          "installati (export): $((Get-WingetInstalled).Count)"

      - name: Collaudo dell'interfaccia (tutte le sezioni e le azioni)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\collaudo"
          $p = Start-Process "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$env:ProgramFiles\MultiTool\MultiTool.ps1`" -SelfTest `"$out`"" -PassThru
          if (-not $p.WaitForExit(100 * 60 * 1000)) { $p.Kill(); "TEMPO SCADUTO" }
          "uscita: $($p.ExitCode)"
          Get-ChildItem $out -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (Test-Path "$out\risultati.json") { foreach ($s in (Get-Content "$out\risultati.json" -Raw | ConvertFrom-Json).Steps) { "### $($s.Step) | $($s.Result) | $($s.Seconds)s | items $($s.Items) | $($s.Status)"; if ($s.Detail) { "    dettaglio: $($s.Detail)" }; if ($s.Error) { "    errore: $($s.Error)" }; if ($s.Info) { "    info: $($s.Info)" }; if ($s.Toasts) { "    avvisi: $($s.Toasts)" } } ; "MESSAGGI:"; (Get-Content "$out\risultati.json" -Raw | ConvertFrom-Json).Messages; "ERRORI-PS:"; (Get-Content "$out\risultati.json" -Raw | ConvertFrom-Json).Errors | ForEach-Object { "ERR> $_" } }
          Get-Content "$out\errori.log" -ErrorAction SilentlyContinue

      - name: Collaudo riga di comando (-Pulizia)
        shell: pwsh
        run: |
          $p = Start-Process "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$env:ProgramFiles\MultiTool\MultiTool.ps1`" -Pulizia" -PassThru
          if (-not $p.WaitForExit(20 * 60 * 1000)) { $p.Kill(); "TEMPO SCADUTO" }
          "uscita: $($p.ExitCode)"
          Get-Content "$env:ProgramData\MultiTool\Dati\history.jsonl" -Tail 30 -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramData\MultiTool\Dati\Logs\errori.log" -ErrorAction SilentlyContinue
          icacls "$env:ProgramData\MultiTool\Dati\settings.json"

      - name: Pubblica i risultati nel ramo collaudo
        if: always()
        shell: pwsh
        run: |
          git config user.name "collaudo"; git config user.email "collaudo@users.noreply.github.com"
          git checkout --orphan collaudo-risultati
          git rm -rf . -q
          Copy-Item "$env:RUNNER_TEMP\collaudo\*" . -Force -ErrorAction SilentlyContinue
          git add -A; git commit -q -m "Collaudo $env:GITHUB_RUN_ID"; git push -f origin collaudo-risultati
