name: suite-test
on: { push: { branches: [ci-suite-test] } }
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:csc.exe /win32icon:ErodyneSuite.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll src\*.cs
          if (-not (Test-Path csc.exe)) { throw 'csc fallito' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($exe in 'mcs.exe','csc.exe') {
            Remove-Item "$env:APPDATA\ErodyneSuite\errori.log" -ErrorAction SilentlyContinue
            $p = Start-Process ".\$exe" -PassThru; Start-Sleep 20
            "== $exe vivo: $(-not $p.HasExited)  exit: $(if($p.HasExited){$p.ExitCode})"
            Get-Content "$env:APPDATA\ErodyneSuite\errori.log" -ErrorAction SilentlyContinue
            $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save("$PWD\$exe.png")
            if (-not $p.HasExited) { Stop-Process $p -Force }
          }
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: '*.png' }
