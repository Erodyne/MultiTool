name: suite-test
on: { push: { branches: [ci-suite-test] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:ErodyneSuite.exe /win32icon:ErodyneSuite.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll src\*.cs
          if (-not (Test-Path ErodyneSuite.exe)) { throw 'csc fallito' }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:T.exe /main:T /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll src\*.cs T.cs
          .\T.exe
          # firma: script PowerShell e verifica con le stesse API della suite
          cd Strumenti; .\Firma-Release.ps1 -NuovaChiave | Out-Null; Set-Content prova.exe 'ciao'; .\Firma-Release.ps1 -File prova.exe
          $pub = ([xml](Get-Content erodyne-firma-PRIVATA.xml -Raw)); $rsa = New-Object Security.Cryptography.RSACryptoServiceProvider; $rsa.FromXmlString((Get-Content erodyne-firma-PRIVATA.xml -Raw))
          $pubXml = $rsa.ToXmlString($false); $v = New-Object Security.Cryptography.RSACryptoServiceProvider; $v.FromXmlString($pubXml)
          $h = [Security.Cryptography.SHA256]::Create().ComputeHash([IO.File]::ReadAllBytes("$PWD\prova.exe")); $sig = [Convert]::FromBase64String((Get-Content prova.exe.sig -Raw).Trim())
          "firma valida: " + $v.VerifyHash($h, [Security.Cryptography.CryptoConfig]::MapNameToOID('SHA256'), $sig)
          $h[0] = $h[0] -bxor 1; "firma su file alterato: " + $v.VerifyHash($h, [Security.Cryptography.CryptoConfig]::MapNameToOID('SHA256'), $sig)
          Remove-Item erodyne-firma-PRIVATA.xml; cd ..
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class W { [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, int m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            public struct RECT { public int L, T, R, B; } }
          "@
          function Shot($n) { $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save("$PWD\$n.png") }
          $p = Start-Process .\ErodyneSuite.exe -PassThru; Start-Sleep 15; $p.Refresh()
          "vivo: $(-not $p.HasExited)"; Shot normal
          $q = Start-Process .\ErodyneSuite.exe -PassThru; Start-Sleep 4; "seconda istanza uscita: $($q.HasExited)"
          $h = $p.MainWindowHandle
          [W]::SendMessage($h, 0x112, [IntPtr]0xF030, [IntPtr]::Zero) | Out-Null; Start-Sleep 3
          $r = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$r) | Out-Null
          "massimizzata: $($r.L),$($r.T),$($r.R),$($r.B)  area: $([Windows.Forms.Screen]::PrimaryScreen.WorkingArea)"; Shot max
          [W]::SendMessage($h, 0x112, [IntPtr]0xF120, [IntPtr]::Zero) | Out-Null; Start-Sleep 2
          [W]::SetForegroundWindow($h) | Out-Null
          [W]::GetWindowRect($h, [ref]$r) | Out-Null
          [W]::SetCursorPos($r.L + 130, $r.T + 46 + 166 + 29) | Out-Null; [W]::mouse_event(2,0,0,0,0); [W]::mouse_event(4,0,0,0,0); Start-Sleep 3
          "dopo ripristino: $($r.L),$($r.T),$($r.R),$($r.B)"; Shot app
          Get-Content "$env:APPDATA\ErodyneSuite\errori.log" -ErrorAction SilentlyContinue
          Stop-Process $p -Force -ErrorAction SilentlyContinue
      - shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add -f ErodyneSuite.exe *.png; git commit -qm "build"; git push -q origin HEAD:ci-suite-out --force
