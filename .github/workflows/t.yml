name: suite-test
on: { push: { branches: [ci-suite-test] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:ErodyneSuite.exe /win32icon:ErodyneSuite.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll src\*.cs
          if (-not (Test-Path ErodyneSuite.exe)) { throw 'csc fallito' }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:T.exe /main:T /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll src\*.cs T.cs
          $env:GH_TOKEN = '${{ github.token }}'
          $env:GH_TOKEN = '${{ github.token }}'
          # gh release upload v2026.11.19.3 MultiTool-Setup-2026.11.19.3.exe.sig --clobber -R Erodyne/MultiTool; "upload firma: $LASTEXITCODE"
          .\T.exe
          "nsis choco: " + ((choco search nsis --exact --limit-output) -join " ")
          # utente standard, come un programma qualsiasi dell'utente
          New-Item -ItemType Directory C:\prova | Out-Null; icacls C:\prova /grant "Users:(OI)(CI)M" | Out-Null
          $pw = ConvertTo-SecureString 'Prova!2026xyzQ' -AsPlainText -Force; New-LocalUser utente -Password $pw | Out-Null
          Copy-Item T.exe C:\prova\; Copy-Item ErodyneSuite.exe C:\prova\
          $cr = New-Object pscredential('utente', $pw)
          Start-Process C:\prova\T.exe -ArgumentList 'acl','C:\prova' -Credential $cr -WorkingDirectory C:\prova -RedirectStandardOutput C:\prova\out.txt -Wait -LoadUserProfile
          Get-Content C:\prova\out.txt
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class W { [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, int m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            public struct RECT { public int L, T, R, B; } }
          "@
          function Shot($n) { $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save("$PWD\$n.png") }
          # --- autoinstallazione ---
          New-Item -ItemType Directory "$env:USERPROFILE\Downloads" -Force | Out-Null
          Copy-Item .\ErodyneSuite.exe "$env:USERPROFILE\Downloads\ErodyneSuite.exe"
          $inst = "$env:LOCALAPPDATA\Programs\ErodyneSuite\ErodyneSuite.exe"
          $d = Start-Process "$env:USERPROFILE\Downloads\ErodyneSuite.exe" -PassThru; Start-Sleep 15; $d.Refresh()
          "scaricato ancora aperto: $(-not $d.HasExited)"
          "installato: $(Test-Path $inst)  menu Start: $(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Erodyne Suite.lnk")  desktop: $(Test-Path "$([Environment]::GetFolderPath('Desktop'))\Erodyne Suite.lnk")"
          $k = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ErodyneSuite -ErrorAction SilentlyContinue
          "App installate: $($k.DisplayName) $($k.DisplayVersion) | $($k.UninstallString)"
          $run = Get-Process ErodyneSuite -ErrorAction SilentlyContinue | ForEach-Object { $_.Path }; "in esecuzione: $run"
          $p = Get-Process ErodyneSuite | Select-Object -First 1
          Shot normal
          $q = Start-Process "$env:USERPROFILE\Downloads\ErodyneSuite.exe" -PassThru; Start-Sleep 6; $q.Refresh(); "seconda apertura dal download chiusa: $($q.HasExited); processi: $((Get-Process ErodyneSuite).Count)"
          $h = $p.MainWindowHandle
          [W]::SendMessage($h, 0x112, [IntPtr]0xF030, [IntPtr]::Zero) | Out-Null; Start-Sleep 2
          $r = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$r) | Out-Null; "massimizzata: $($r.L),$($r.T),$($r.R),$($r.B)"
          [W]::SendMessage($h, 0x112, [IntPtr]0xF120, [IntPtr]::Zero) | Out-Null; Start-Sleep 1
          # disinstallazione da "App installate" (silenziosa: chiude anche la suite aperta)
          Start-Process $inst -ArgumentList '--disinstalla','--silenzioso' -Wait; Start-Sleep 8
          "dopo disinstallazione: cartella=$(Test-Path (Split-Path $inst))  registro=$(Test-Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ErodyneSuite)  menu=$(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Erodyne Suite.lnk")  processi=$((Get-Process ErodyneSuite -ErrorAction SilentlyContinue).Count)"
          $x = Start-Process .\ErodyneSuite.exe -ArgumentList '--portatile' -PassThru; Start-Sleep 8; $x.Refresh(); "portatile aperto: $(-not $x.HasExited)  installato: $(Test-Path $inst)"; Stop-Process $x -Force -ErrorAction SilentlyContinue
          Get-Content "$env:APPDATA\ErodyneSuite\errori.log" -ErrorAction SilentlyContinue
          
      - shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add -f ErodyneSuite.exe *.png; git commit -qm "build"; git push -q origin HEAD:ci-suite-out --force
